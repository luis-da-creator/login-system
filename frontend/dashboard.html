<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card dashboard-card">
    <h1>Welcome to our website</h1>
    <p class="subtitle" id="welcome">Loading...</p>
 
        <section class="photos">
      <figure class="photo-item">
        <div class="photo"><img src="images/Pronto.jpg" alt="Photo 1" style="object-position: center 45%"></div>
        <h2>Pronto</h2>
        <p>Medyo hawig ni joshua, BACKEND guys!</p>
      </figure>
      <figure class="photo-item">
        <div class="photo"><img src="images/lerios.png" alt="Photo 2" style="object-position: center 25%"></div>
        <h2>Lerios AKA lANZ</h2>
        <p>This isss lANZZZZ!!! FRONTEND.</p>
      </figure>
      <figure class="photo-item">
        <div class="photo"><img src="images/levi.jpg" alt="Photo 3" style="object-position: center 30%"></div>
        <h2>Pajanostan AKA Malupitol</h2>
        <p>Imbes nagaluto ang ginagawa nagalu -lolomo /WED DESIGNER</p>
      </figure>
    </section>
 
    <button class="logout" id="logout">Logout</button>
 
    <footer>&copy; 2026 Your Website. All rights reserved.</footer>
  </main>
 
  <script>
   const API_URL = "https://login-system-w7u3.onrender.com";
    const token = localStorage.getItem("token");
 
    if (!token) {
      window.location.href = "index.html";
    }
 
    fetch(`${API_URL}/api/profile`, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    })
    .then(response => {
      if (!response.ok) throw new Error();
      return response.json();
    })
    .then(data => {
      document.getElementById("welcome").textContent =
        `Signed in as ${data.user.name} (${data.user.email})`;
    })
    .catch(() => {
      localStorage.removeItem("token");
      window.location.href = "index.html";
    });
 
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
