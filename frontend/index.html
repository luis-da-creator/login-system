<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="avatar" aria-hidden="true">
  <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z"/></svg>
</div>

  <main class="card">
    
    <!-- LOGIN FORM (Headers moved inside) -->
    <form id="loginForm">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" required>

      <button type="submit">Login</button>
      <p id="message"></p>
    </form>

    <!-- REGISTER FORM (Headers moved inside) -->
    <form id="registerForm" class="hidden">
      <h1>Create Account</h1>
      <p class="subtitle">Sign up for a new account</p>

      <label>Name</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="regEmail" required>

      <label>Password</label>
      <input type="password" id="regPassword" required>

      <button type="submit">Register</button>
      <p id="registerMessage"></p>
    </form>

    <!-- TOGGLE LINK (Moved to the very bottom) -->
    <p style="text-align: center; margin-top: 15px;">
      <span id="toggleText">Don't have an account? </span> 
      <a href="#" id="showRegister">Register</a>
    </p>

  </main>

  <script src="app.js"></script>
</body>
</html>
